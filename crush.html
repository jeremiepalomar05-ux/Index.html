<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>For My Crush 💗</title> <style> body { background: linear-gradient(135deg, #ffc0cb, #ff69b4); font-family: Arial, sans-serif; text-align: center; min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; overflow: hidden; } .box { background: white; padding: 30px 20px; border-radius: 25px; width: 85%; max-width: 350px; box-shadow: 0 10px 30px #d6338460; } h1 { color: #ff1493; font-size: 27px; } p { color: #555; font-size: 17px; } button { border: none; padding: 12px 25px; margin: 8px; border-radius: 25px; font-size: 16px; cursor: pointer; transition: 0.2s; } #yes { background: #ff1493; color: white; } #no { background: #eee; color: #444; } button:hover { transform: scale(1.08); } .heart { position: fixed; bottom: -30px; animation: floatUp 5s linear infinite; pointer-events: none; } @keyframes floatUp { to { transform: translateY(-110vh) rotate(360deg); opacity: 0; } } </style> </head> <body> <div class="box"> <div style="font-size: 55px;">💗</div> <h1 id="question">Eh, crush back ko nimo? 🥹</h1> <p id="message">Please answer honestly haaa! 💕</p> <button id="yes" onclick="sayYes()">Yes 💖</button> <button id="no" onclick="sayNo()">No 😭</button> </div> <script> let count = 0; const questions = [ "Are you sure? 🥺", "Surenajud nga sure?? 😭", "Last na jud ni, sure na jud ka? 💔", "Wala najud chance? 🥹", "Please think about it again? 💗", "Final answer na jud na? 😭" ]; function sayYes() { document.getElementById("question").innerHTML = "YEYYYY! I LOVE YOU! 💖🥹"; document.getElementById("message").innerHTML = "Halaaa, crush back diay ko nimo! Kilig much! 😭💕"; document.getElementById("yes").style.display = "none"; document.getElementById("no").style.display = "none"; for (let i = 0; i < 30; i++) { setTimeout(makeHeart, i * 100); } } function sayNo() { document.getElementById("question").innerHTML = questions[count % questions.length]; document.getElementById("message").innerHTML = "Hmmm... basin mag-usab pa imong mind? 🥹💗"; count++; document.getElementById("no").innerHTML = "No 😭"; document.getElementById("yes").innerHTML = "Yes 💖"; } function makeHeart() { const heart = document.createElement("div"); heart.className = "heart"; heart.innerHTML = ["💗", "💖", "💕", "💘", "❤️"][ Math.floor(Math.random() * 5) ]; heart.style.left = Math.random() * 100 + "vw"; heart.style.fontSize = (20 + Math.random() * 25) + "px"; heart.style.animationDuration = (3 + Math.random() * 3) + "s"; document.body.appendChild(heart); setTimeout(() => heart.remove(), 6000); } setInterval(makeHeart, 700); </script> </body> </html>
